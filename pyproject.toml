[project]
name = "capital-gains"
version = "0.1.0"
description = "A Command-Line Interface (CLI) for calculating the tax due on profits or losses from stock market operations (or equity trading)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
capital-gains = "capital_gains.cli:main"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff.lint]
select = [
  # pycodestyle
  "E4",
  "E7",
  "E9",
  "W",
  # pyflakes
  "F",
  # pyupgrade
  "UP",
  # isort
  "I",
  # mccabe
  "C90",
  # flake8-bandit
  "S",
  # flake8-annotations
  "ANN",
  # flake-pyi
  "PYI",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # ruff-specific rules
  "RUF",
  # flake8-pytest-style
  "PT",
]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  # use of assert detected
  "S101"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=capital_gains --cov-fail-under=95"
